server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    location / {
        # Re-resolve the app service via Docker's embedded DNS so that
        # recreating the app container (new IP) doesn't leave nginx proxying a
        # stale address. Using a variable in proxy_pass forces runtime lookup.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app app:8000;
        proxy_pass http://$upstream_app$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }
}

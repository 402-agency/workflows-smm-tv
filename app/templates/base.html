<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Trend Analyzer{% endblock %}</title>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body class="min-h-full bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <a href="/" class="flex items-center gap-2 text-lg font-semibold text-brand">
          <span>🎬</span> Trend Analyzer
        </a>
        <nav class="flex items-center gap-4 text-sm">
          <a href="/" class="text-slate-600 hover:text-brand">Dashboard</a>
          <a href="/runs" class="text-slate-600 hover:text-brand">Runs</a>
          <form action="/actions/run" method="post">
            <button type="submit" class="btn-primary">Run pipeline</button>
          </form>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-6">
      {% if message %}
        <div class="mb-4 rounded-md border border-brand/30 bg-brand/5 px-4 py-2 text-sm text-brand-dark">
          {{ message }}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    <footer class="mx-auto max-w-6xl px-4 py-8 text-center text-xs text-slate-400">
      Trend Analyzer · self-hosted
    </footer>
  </body>
</html>
